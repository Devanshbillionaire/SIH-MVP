<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroJet Travel - Version B</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #fdf2f8; color: #831843; padding: 2rem; }
    .v2-wrapper { max-width: 820px; margin: 0 auto; background: white; border-radius: 16px; padding: 2.25rem; border: 1px solid #fbcfe8; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .v2-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #f472b6; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h2 { color: #db2777; font-size: 1.6rem; font-weight: 800; }
    .v2-badge { background: #fce7f3; color: #9d174d; padding: 6px 14px; border-radius: 9999px; font-size: 0.85rem; font-weight: 700; }
    .v2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem; }
    .v2-label { font-size: 0.85rem; font-weight: 700; color: #be185d; margin-bottom: 0.4rem; text-transform: uppercase; }
    .v2-input-box { width: 100%; padding: 14px; border: 2px solid #f472b6; border-radius: 10px; font-size: 1rem; background: #fff1f2; outline: none; }
    .v2-search-action { grid-column: span 2; padding: 16px; background: #db2777; color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 1.05rem; cursor: pointer; }
    .v2-flight-box { background: #fafafa; border: 1px solid #f472b6; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .v2-reserve-btn { padding: 12px 20px; background: #e11d48; color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .v2-alert { display: none; background: #fce7f3; border: 2px solid #db2777; color: #831843; padding: 1.25rem; border-radius: 10px; margin-top: 1.5rem; font-weight: 800; text-align: center; }
  </style>
</head>
<body>
  <div class="v2-wrapper">
    <div class="v2-top">
      <h2>AeroJet Travel Portal 🛫</h2>
      <span class="v2-badge">VERSION B (Alternative Selectors)</span>
    </div>

    <div class="v2-grid">
      <div>
        <div class="v2-label">Origin Location</div>
        <input type="text" name="origin_airport" class="v2-input-box" placeholder="Enter origin city" />
      </div>

      <div>
        <div class="v2-label">Destination Location</div>
        <input type="text" name="destination_airport" class="v2-input-box" placeholder="Enter destination city" />
      </div>

      <button class="v2-search-action" onclick="v2SearchFlights()">Search Flights 🛫</button>
    </div>

    <div id="v2-flight-results" style="display:none;">
      <div class="v2-flight-box">
        <div>
          <div style="font-weight:800; font-size:1.1rem; color:#9f1239;">AeroJet AJ-901 | Express</div>
          <div style="color:#6b7280; font-size:0.85rem;">09:15 AM - 11:30 AM | $110</div>
        </div>
        <button class="v2-reserve-btn" onclick="v2Reserve('AJ-901')">Reserve Now</button>
      </div>
    </div>

    <div id="v2-confirmation" class="v2-alert">
      🛫 Flight Ticket Reserved! Verification confirmed on Version B portal.
    </div>
  </div>

  <script>
    function v2SearchFlights() {
      document.getElementById('v2-flight-results').style.display = 'block';
    }

    function v2Reserve(flight) {
      const c = document.getElementById('v2-confirmation');
      c.innerText = "🛫 Flight Ticket " + flight + " Reserved! Verification success confirmed on modified DOM.";
      c.style.display = 'block';
    }
  </script>
</body>
</html>
